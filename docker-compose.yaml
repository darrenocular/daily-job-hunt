services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATASOURCE_USERNAME:?err}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:?err}
      POSTGRES_DB: ${DATASOURCE_NAME:?err}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: